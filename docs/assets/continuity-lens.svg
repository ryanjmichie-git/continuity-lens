<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Continuity Lens system overview</title>
  <desc id="desc">Video context predicts future latent tokens, which are compared with observed target tokens and inexpensive baselines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="64" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">Continuity Lens</text>
  <text x="64" y="102" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="18">Does a learned future agree with what happened next?</text>
