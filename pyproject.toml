[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "continuity-lens"
version = "0.1.0"
description = "A V-JEPA research probe for measuring discontinuity at video boundaries."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Continuity Lens contributors" }]
dependencies = [
  "av>=14,<17",
  "einops>=0.8,<1",
  "gradio>=5,<7",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "scikit-image>=0.24,<1",
  "scikit-learn>=1.5,<2",
  "timm>=1.0,<2",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "typer>=0.15,<1",
]

[project.scripts]
continuity-lens = "continuity_lens.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/continuity_lens"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/continuity_lens/cli.py" = ["B008"]
